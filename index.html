<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="國家核安全展板知識挑戰，適合香港初中學生。">
  <title>國家核安全知識挑戰</title>

  <style>
    :root {
      --navy: #082b45;
      --navy-2: #0e4768;
      --red: #c5282f;
      --red-dark: #971d24;
      --green: #14795b;
      --yellow: #f3c64d;
      --paper: #ffffff;
      --surface: #eef3f5;
      --line: #c8d4da;
      --text: #17242b;
      --muted: #56707c;
      --correct: #087647;
      --wrong: #b3262e;
      --focus: #f3c64d;
      --shadow: 0 10px 30px rgba(5, 35, 52, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--surface);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei",
        system-ui, sans-serif;
      letter-spacing: 0;
      background:
        linear-gradient(90deg, rgba(8, 43, 69, 0.045) 1px, transparent 1px),
        linear-gradient(rgba(8, 43, 69, 0.045) 1px, transparent 1px),
        var(--surface);
      background-size: 32px 32px;
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 4px solid rgba(243, 198, 77, 0.75);
      outline-offset: 3px;
    }

    .site-header {
      min-height: 92px;
      color: #fff;
      background: var(--navy);
      border-bottom: 5px solid var(--red);
    }

    .header-inner {
      width: min(1120px, calc(100% - 32px));
      min-height: 87px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--yellow);
      font-size: 34px;
      background: #062238;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
    }

    .brand-kicker {
      margin: 0 0 3px;
      color: #9fd8c5;
      font-size: 13px;
      font-weight: 800;
    }

    .brand-title {
      margin: 0;
      color: #fff;
      font-size: clamp(20px, 3vw, 29px);
      line-height: 1.2;
    }

    .header-badge {
      padding: 7px 11px;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 4px;
    }

    main {
      width: min(1040px, calc(100% - 28px));
      margin: 30px auto 48px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .start-panel,
    .quiz-panel {
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .start-banner {
      padding: 42px clamp(24px, 6vw, 70px);
      color: #fff;
      background: var(--navy-2);
      border-left: 9px solid var(--red);
    }

    .start-banner .label {
      display: inline-block;
      margin-bottom: 14px;
      padding: 5px 9px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 900;
      background: var(--yellow);
      border-radius: 3px;
    }

    .start-banner h2 {
      max-width: 720px;
      margin: 0 0 12px;
      font-size: clamp(30px, 7vw, 52px);
      line-height: 1.12;
    }

    .start-banner p {
      max-width: 720px;
      margin: 0;
      color: #dcecf2;
      font-size: 17px;
      line-height: 1.75;
    }

    .start-content {
      padding: 30px clamp(24px, 6vw, 70px) 38px;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-bottom: 28px;
      border: 1px solid var(--line);
    }

    .fact {
      min-height: 100px;
      padding: 20px 16px;
      text-align: center;
      background: #f7fafb;
    }

    .fact + .fact {
      border-left: 1px solid var(--line);
    }

    .fact strong {
      display: block;
      margin-bottom: 5px;
      color: var(--red-dark);
      font-size: 25px;
    }

    .fact span {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .start-note {
      margin: 0 0 25px;
      padding: 14px 16px;
      color: #334c57;
      line-height: 1.65;
      background: #e8f3ef;
      border-left: 5px solid var(--green);
    }

    .primary-btn,
    .secondary-btn {
      min-height: 48px;
      padding: 11px 22px;
      cursor: pointer;
      font-weight: 900;
      border-radius: 5px;
      transition: transform 150ms ease, background 150ms ease;
    }

    .primary-btn {
      color: #fff;
      background: var(--red);
      border: 2px solid var(--red);
    }

    .primary-btn:hover {
      background: var(--red-dark);
      border-color: var(--red-dark);
      transform: translateY(-1px);
    }

    .secondary-btn {
      color: var(--navy);
      background: #fff;
      border: 2px solid var(--navy);
    }

    .secondary-btn:hover {
      color: #fff;
      background: var(--navy);
    }

    .start-btn {
      width: 100%;
      min-height: 58px;
      font-size: 18px;
    }

    .statusbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 18px 22px;
      color: #fff;
      background: var(--navy);
    }

    .progress-copy {
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 800;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 4px;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--yellow);
      transition: width 250ms ease;
    }

    .timer {
      min-width: 112px;
      padding: 8px 13px;
      text-align: center;
      background: #061f33;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 5px;
    }

    .timer-label {
      display: block;
      margin-bottom: 2px;
      color: #b6cad4;
      font-size: 11px;
      font-weight: 800;
    }

    .timer-value {
      font-variant-numeric: tabular-nums;
      font-size: 24px;
      font-weight: 900;
    }

    .timer.warning {
      color: #1c2022;
      background: var(--yellow);
      border-color: var(--yellow);
    }

    .timer.danger {
      color: #fff;
      background: var(--red);
      border-color: var(--red);
      animation: pulse 700ms infinite alternate;
    }

    @keyframes pulse {
      to { opacity: 0.78; }
    }

    .question-area {
      min-height: 480px;
      padding: clamp(24px, 5vw, 46px);
    }

    .panel-hint {
      display: inline-flex;
      align-items: center;
      margin-bottom: 18px;
      padding: 8px 12px;
      color: #07553f;
      font-size: 14px;
      font-weight: 900;
      background: #e5f3ee;
      border-left: 4px solid var(--green);
      border-radius: 3px;
    }

    .question-number {
      margin: 0 0 8px;
      color: var(--red-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .question-text {
      min-height: 70px;
      margin: 0 0 24px;
      color: var(--navy);
      font-size: clamp(22px, 4vw, 30px);
      line-height: 1.45;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      width: 100%;
      min-height: 57px;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: 34px 1fr;
      align-items: center;
      gap: 12px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      background: #f8fafb;
      border: 2px solid #c8d4da;
      border-radius: 6px;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .option:hover:not(:disabled) {
      background: #eef6f8;
      border-color: var(--navy-2);
    }

    .option-letter {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
      background: var(--navy-2);
      border-radius: 50%;
    }

    .option-text {
      font-weight: 750;
      line-height: 1.45;
    }

    .option.correct {
      color: #064b30;
      background: #dff2e8;
      border-color: var(--correct);
    }

    .option.correct .option-letter {
      background: var(--correct);
    }

    .option.wrong {
      color: #74171d;
      background: #fae7e8;
      border-color: var(--wrong);
    }

    .option.wrong .option-letter {
      background: var(--wrong);
    }

    .feedback {
      min-height: 28px;
      margin: 18px 0 0;
      font-weight: 900;
    }

    .feedback.good {
      color: var(--correct);
    }

    .feedback.bad {
      color: var(--wrong);
    }

    dialog {
      width: min(700px, calc(100% - 28px));
      max-height: 88vh;
      padding: 0;
      overflow: hidden;
      color: var(--text);
      background: #fff;
      border: 0;
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    dialog::backdrop {
      background: rgba(3, 22, 34, 0.78);
    }

    .result-head {
      padding: 30px;
      color: #fff;
      text-align: center;
      background: var(--navy);
      border-top: 6px solid var(--red);
    }

    .result-symbol {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      color: var(--yellow);
      font-size: 34px;
      border: 2px solid var(--yellow);
      border-radius: 50%;
    }

    .result-head h2 {
      margin: 0 0 5px;
      font-size: 27px;
    }

    .result-score {
      margin: 0;
      color: #c7dce5;
    }

    .result-score strong {
      color: #fff;
      font-size: 34px;
    }

    .result-body {
      max-height: 55vh;
      padding: 24px 28px 28px;
      overflow-y: auto;
    }

    .encouragement {
      margin: 0 0 20px;
      color: var(--navy);
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.5;
    }

    .review-title {
      margin: 22px 0 12px;
      color: var(--navy);
      font-size: 17px;
    }

    .review-list {
      display: grid;
      gap: 9px;
    }

    .review-item {
      padding: 12px 14px;
      background: #f5f8f9;
      border-left: 4px solid var(--wrong);
    }

    .review-item.correct-review {
      border-left-color: var(--correct);
    }

    .review-item p {
      margin: 0;
      line-height: 1.5;
    }

    .review-answer {
      margin-top: 5px !important;
      color: var(--muted);
      font-size: 14px;
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 22px;
    }

    footer {
      width: min(1040px, calc(100% - 28px));
      margin: 0 auto 28px;
      color: #526d79;
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      .site-header,
      .header-inner {
        min-height: 80px;
      }

      .header-inner {
        width: min(100% - 22px, 1120px);
      }

      .brand-mark {
        width: 45px;
        height: 45px;
        font-size: 27px;
      }

      .header-badge {
        display: none;
      }

      main {
        margin-top: 18px;
      }

      .start-banner {
        padding: 30px 22px;
      }

      .start-content {
        padding: 22px;
      }

      .facts {
        grid-template-columns: 1fr;
      }

      .fact {
        min-height: auto;
        padding: 15px;
      }

      .fact + .fact {
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      .statusbar {
        gap: 10px;
        padding: 14px;
      }

      .timer {
        min-width: 92px;
      }

      .timer-value {
        font-size: 21px;
      }

      .question-area {
        min-height: 500px;
        padding: 24px 18px;
      }

      .question-text {
        min-height: 96px;
      }

      .option {
        padding: 11px;
        grid-template-columns: 30px 1fr;
      }

      .option-letter {
        width: 29px;
        height: 29px;
      }

      .result-actions {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">☢</div>
        <div>
          <p class="brand-kicker">認識風險・提升安全・共同守護</p>
          <h1 class="brand-title">國家核安全知識挑戰</h1>
        </div>
      </div>
      <div class="header-badge">國家安全教育</div>
    </div>
  </header>

  <main>
    <section id="startScreen" class="screen active" aria-labelledby="startTitle">
      <div class="start-panel">
        <div class="start-banner">
          <span class="label">展板學習活動</span>
          <h2 id="startTitle">你對核安全認識多少？</h2>
          <p>從事故中吸取教訓，以科學、制度及責任守護人民安全。</p>
        </div>

        <div class="start-content">
          <div class="facts" aria-label="遊戲資料">
            <div class="fact">
              <strong>100</strong>
              <span>題展板題庫</span>
            </div>
            <div class="fact">
              <strong>20</strong>
              <span>題目總數</span>
            </div>
            <div class="fact">
              <strong>01:30</strong>
              <span>作答時間</span>
            </div>
          </div>

          <p class="start-note">
            每題均會提示答案位於哪一幅展板。完成作答或時間結束後，
            系統會公布得分及正確答案。
          </p>

          <button id="startButton" class="primary-btn start-btn" type="button">
            開始挑戰
          </button>
        </div>
      </div>
    </section>

    <section id="quizScreen" class="screen" aria-label="核安全選擇題">
      <div class="quiz-panel">
        <div class="statusbar">
          <div>
            <div id="progressCopy" class="progress-copy">第 1 / 10 題</div>
            <div class="progress-track" aria-hidden="true">
              <div id="progressFill" class="progress-fill"></div>
            </div>
          </div>

          <div id="timer" class="timer" aria-live="polite">
            <span class="timer-label">剩餘時間</span>
            <span id="timerValue" class="timer-value">01:30</span>
          </div>
        </div>

        <div class="question-area">
          <div id="panelHint" class="panel-hint"></div>
          <p id="questionNumber" class="question-number"></p>
          <h2 id="questionText" class="question-text"></h2>
          <div id="options" class="options"></div>
          <p id="feedback" class="feedback" aria-live="polite"></p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    核安全不是單靠一項技術，而是由科學設計、嚴格監管、專業操作、
    應急管理及社會共同參與所共同保障。
  </footer>

  <dialog id="resultDialog" aria-labelledby="resultTitle">
    <div class="result-head">
      <div class="result-symbol" aria-hidden="true">✓</div>
      <h2 id="resultTitle">挑戰完成</h2>
      <p class="result-score">
        得分：<strong id="scoreDisplay">0 / 10</strong>
      </p>
    </div>

    <div class="result-body">
      <p id="encouragement" class="encouragement"></p>

      <h3 class="review-title">答案回顧</h3>
      <div id="reviewList" class="review-list"></div>

      <div class="result-actions">
        <button id="restartButton" class="primary-btn" type="button">
          再挑戰一次
        </button>
        <button id="homeButton" class="secondary-btn" type="button">
          返回首頁
        </button>
      </div>
    </div>
  </dialog>

  <script>
    "use strict";

    const QUESTION_COUNT = 20;
    const QUIZ_SECONDS = 90;

    /*
      題目格式：
      [展板編號, 展板分段, 題目, 正確答案, 錯誤答案1, 錯誤答案2, 錯誤答案3]
    */
    const questionBank = [
      [1,"核事故不是核彈爆炸","核電站利用甚麼過程產生熱能？","受控的核裂變","煤炭燃燒","太陽能聚變","海水蒸發"],
      [1,"核事故不是核彈爆炸","核事故與核武器爆炸的原理是否相同？","不同","完全相同","只有地點不同","只有聲音不同"],
      [1,"核事故概述","核事故一般可能涉及哪類系統失去控制？","反應、冷卻或安全系統","售票系統","交通燈系統","校園廣播系統"],
      [1,"核事故概述","核燃料受損後可能造成甚麼後果？","放射性物質釋放","氧氣完全消失","海水變成食水","反應堆變成核武器"],
      [1,"認識風險，吸取教訓","核事故的成因通常涉及甚麼？","技術、管理及應急等多重因素","只有天氣因素","只有個人運氣","必然只有設備老化"],
      [1,"切爾諾貝爾事故","切爾諾貝爾核事故發生於哪一年？","1986年","1976年","1996年","2011年"],
      [1,"切爾諾貝爾事故","切爾諾貝爾事故發生於哪一天？","1986年4月26日","1986年1月1日","2011年3月11日","2018年1月1日"],
      [1,"切爾諾貝爾事故","切爾諾貝爾核電站位於哪個地方？","前蘇聯烏克蘭","日本福島縣","中國香港","美國紐約"],
      [1,"切爾諾貝爾事故","切爾諾貝爾事故涉及哪一號機組？","第4號機組","第1號機組","第2號機組","第8號機組"],
      [1,"切爾諾貝爾事故","切爾諾貝爾事故涉及哪種反應堆？","RBMK-1000反應堆","沸水式反應堆","太陽能反應堆","潮汐反應堆"],
      [1,"切爾諾貝爾事故","事故發生時，工作人員正在進行甚麼？","安全測試","建築工程","食品檢測","醫療演習"],
      [1,"切爾諾貝爾事故","安全測試在甚麼運行狀態下進行？","低功率狀態","最高功率狀態","完全拆卸狀態","永久停用狀態"],
      [1,"切爾諾貝爾事故","切爾諾貝爾反應堆失控時，功率出現甚麼變化？","突然急升","立即降至零","保持完全不變","緩慢下降十年"],
      [1,"切爾諾貝爾事故","反應堆失控後發生了甚麼？","蒸氣爆炸及火災","海嘯及颱風","沙塵暴及雪崩","核武器爆炸"],
      [1,"事故成因","RBMK反應堆在哪種狀態下較難控制？","特定低功率狀態","正常關閉後","裝運途中","退役完成後"],
      [1,"事故成因","工作人員在測試中出現哪項操作問題？","偏離部分操作程序","提早發布天氣報告","增加食品檢測","進行過多疏散演習"],
      [1,"事故成因","測試期間部分安全系統受到甚麼處理？","被停用或繞過","全部增加一倍","改為醫療設備","移到另一個國家"],
      [1,"事故成因","切爾諾貝爾事故反映哪方面受到的重視不足？","安全文化","旅遊文化","飲食文化","體育文化"],

      progressCopy.textContent =
        `第 ${currentQuestion + 1} / ${QUESTION_COUNT} 題`;

      progressFill.style.width = `${progress}%`;
      panelHint.textContent =
        `提示：答案可於第 ${question.panel} 幅展板「${question.section}」找到`;

      questionNumber.textContent =
        `題庫題目 ${questionBank.indexOf(findRawQuestion(question)) + 1}`;

      questionText.textContent = question.text;
      optionsElement.replaceChildren();

      question.options.forEach((option, index) => {
        const button = document.createElement("button");
        const letter = document.createElement("span");
        const text = document.createElement("span");

        button.type = "button";
        button.className = "option";
        button.dataset.answer = option;

        letter.className = "option-letter";
        letter.textContent = String.fromCharCode(65 + index);

        text.className = "option-text";
        text.textContent = option;

        button.append(letter, text);
        button.addEventListener("click", () => selectAnswer(button, option));
        optionsElement.appendChild(button);
      });

      const firstOption = optionsElement.querySelector(".option");
      if (firstOption) {
        firstOption.focus();
      }
    }

    function findRawQuestion(question) {
      return questionBank.find((rawQuestion) =>
        rawQuestion[0] === question.panel &&
        rawQuestion[1] === question.section &&
        rawQuestion[2] === question.text
      );
    }

    function selectAnswer(selectedButton, selectedAnswer) {
      if (answerLocked) {
        return;
      }

      answerLocked = true;
      const question = quizQuestions[currentQuestion];
      const isCorrect = selectedAnswer === question.answer;
      const optionButtons = optionsElement.querySelectorAll(".option");

      optionButtons.forEach((button) => {
        button.disabled = true;

        if (button.dataset.answer === question.answer) {
          button.classList.add("correct");
        }
      });

      if (isCorrect) {
        score += 1;
        feedback.textContent = "答對了！";
        feedback.classList.add("good");
      } else {
        selectedButton.classList.add("wrong");
        feedback.textContent = `正確答案：${question.answer}`;
        feedback.classList.add("bad");
      }

      responses.push({
        question: question.text,
        answer: question.answer,
        selected: selectedAnswer,
        panel: question.panel,
        correct: isCorrect
      });

      window.setTimeout(() => {
        if (currentQuestion < QUESTION_COUNT - 1) {
          currentQuestion += 1;
          showQuestion();
        } else {
          finishQuiz(false);
        }
      }, 700);
    }

    function updateTimer() {
      const minutes = Math.floor(secondsLeft / 60);
      const seconds = secondsLeft % 60;

      timerValue.textContent =
        `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

      timer.classList.remove("warning", "danger");

      if (secondsLeft <= 10) {
        timer.classList.add("danger");
      } else if (secondsLeft <= 30) {
        timer.classList.add("warning");
      }
    }

    function finishQuiz(timeUp) {
      clearInterval(timerId);
      timerId = null;
      answerLocked = true;

      const unansweredQuestions = quizQuestions.slice(responses.length);

      unansweredQuestions.forEach((question) => {
        responses.push({
          question: question.text,
          answer: question.answer,
          selected: "未作答",
          panel: question.panel,
          correct: false
        });
      });

      const percentage = Math.round((score / QUESTION_COUNT) * 100);

      resultTitle.textContent = timeUp ? "時間到！" : "挑戰完成";
      scoreDisplay.textContent = `${score} / ${QUESTION_COUNT}`;

      if (percentage === 100) {
        encouragement.textContent =
          "滿分！你對三幅展板的核安全內容掌握得非常全面。";
      } else if (percentage >= 80) {
        encouragement.textContent =
          "表現優秀！你已掌握核事故、應急及國家核安全保障的重點。";
      } else if (percentage >= 60) {
        encouragement.textContent =
          "做得不錯！再查看展板中的關鍵詞，下一次可以取得更高分。";
      } else if (percentage >= 40) {
        encouragement.textContent =
          "你已掌握部分重點。參考答案提示，再閱讀相關展板內容吧。";
      } else {
        encouragement.textContent =
          "繼續努力！每次挑戰都會隨機抽題，從展板尋找答案再試一次。";
      }

      buildReview();
      resultDialog.showModal();
    }

    function buildReview() {
      reviewList.replaceChildren();

      responses.forEach((response, index) => {
        const item = document.createElement("div");
        const questionLine = document.createElement("p");
        const answerLine = document.createElement("p");

        item.className =
          `review-item${response.correct ? " correct-review" : ""}`;

        questionLine.textContent =
          `${index + 1}. ${response.correct ? "答對" : "答錯"}：${response.question}`;

        answerLine.className = "review-answer";
        answerLine.textContent =
          `正確答案：${response.answer}｜第 ${response.panel} 幅展板`;

        item.append(questionLine, answerLine);
        reviewList.appendChild(item);
      });
    }

    function returnHome() {
      clearInterval(timerId);
      timerId = null;
      resultDialog.close();
      quizScreen.classList.remove("active");
      startScreen.classList.add("active");
      startButton.focus();
    }

    startButton.addEventListener("click", startQuiz);
    restartButton.addEventListener("click", startQuiz);
    homeButton.addEventListener("click", returnHome);

    document.addEventListener("keydown", (event) => {
      if (!quizScreen.classList.contains("active") || answerLocked) {
        return;
      }

      const number = Number(event.key);

      if (number >= 1 && number <= 4) {
        const option = optionsElement.querySelectorAll(".option")[number - 1];
        if (option) {
          option.click();
        }
      }
    });
  </script>
</body>
</html>
