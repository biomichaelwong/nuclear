<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="國家核安全展板知識挑戰，適合香港初中學生。">
  <title>國家核安全知識挑戰</title>

  <style>
    :root {
      --navy: #082b45;
      --navy-light: #0e4768;
      --red: #c5282f;
      --red-dark: #971d24;
      --green: #14795b;
      --yellow: #f3c64d;
      --white: #ffffff;
      --surface: #eef3f5;
      --line: #c8d4da;
      --text: #17242b;
      --muted: #56707c;
      --correct: #087647;
      --wrong: #b3262e;
      --shadow: 0 10px 30px rgba(5, 35, 52, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--surface);
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      color: var(--text);
      font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei",
        system-ui, -apple-system, sans-serif;
      background:
        linear-gradient(90deg, rgba(8, 43, 69, 0.045) 1px, transparent 1px),
        linear-gradient(rgba(8, 43, 69, 0.045) 1px, transparent 1px),
        var(--surface);
      background-size: 32px 32px;
      -webkit-text-size-adjust: 100%;
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 3px solid rgba(243, 198, 77, 0.9);
      outline-offset: 2px;
    }

    .site-header {
      color: #fff;
      background: var(--navy);
      border-bottom: 4px solid var(--red);
    }

    .header-inner {
      width: min(960px, calc(100% - 40px));
      min-height: 80px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--yellow);
      font-size: 30px;
      background: #061f33;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
    }

    .brand-kicker {
      margin: 0 0 2px;
      color: #9fd8c5;
      font-size: 13px;
      font-weight: 800;
    }

    .brand-title {
      margin: 0;
      color: #fff;
      font-size: clamp(20px, 2.6vw, 26px);
      line-height: 1.25;
    }

    .header-badge {
      padding: 6px 12px;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 4px;
    }

    main {
      width: min(920px, calc(100% - 36px));
      margin: 24px auto 36px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .start-panel,
    .quiz-panel {
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    .start-banner {
      padding: 36px clamp(24px, 5vw, 54px);
      color: #fff;
      background: var(--navy-light);
      border-left: 8px solid var(--red);
    }

    .start-banner .label {
      display: inline-block;
      margin-bottom: 12px;
      padding: 5px 10px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 900;
      background: var(--yellow);
      border-radius: 3px;
    }

    .start-banner h2 {
      max-width: 760px;
      margin: 0 0 10px;
      font-size: clamp(26px, 4.5vw, 42px);
      line-height: 1.18;
    }

    .start-banner p {
      max-width: 760px;
      margin: 0;
      color: #dcecf2;
      font-size: 16px;
      line-height: 1.65;
    }

    .start-content {
      padding: 28px clamp(20px, 5vw, 54px) 34px;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-bottom: 22px;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }

    .fact {
      min-height: 90px;
      padding: 16px 12px;
      text-align: center;
      background: #f7fafb;
    }

    .fact + .fact {
      border-left: 1px solid var(--line);
    }

    .fact strong {
      display: block;
      margin-bottom: 4px;
      color: var(--red-dark);
      font-size: 24px;
    }

    .fact span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .start-note {
      margin: 0 0 20px;
      padding: 13px 16px;
      color: #334c57;
      font-size: 15px;
      line-height: 1.6;
      background: #e8f3ef;
      border-left: 5px solid var(--green);
      border-radius: 4px;
    }

    .primary-btn,
    .secondary-btn {
      min-height: 48px;
      padding: 11px 22px;
      cursor: pointer;
      font-weight: 800;
      border-radius: 6px;
      transition: transform 120ms ease, background 120ms ease, opacity 120ms ease;
    }

    .primary-btn {
      color: #fff;
      background: var(--red);
      border: 2px solid var(--red);
    }

    .primary-btn:hover {
      background: var(--red-dark);
      border-color: var(--red-dark);
    }

    .primary-btn:active {
      transform: scale(0.98);
      background: var(--red-dark);
    }

    .secondary-btn {
      color: var(--navy);
      background: #fff;
      border: 2px solid var(--navy);
    }

    .secondary-btn:active {
      transform: scale(0.98);
      background: #eef3f5;
    }

    .start-btn {
      width: 100%;
      min-height: 54px;
      font-size: 18px;
    }

    .statusbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 14px 22px;
      color: #fff;
      background: var(--navy);
    }

    .progress-copy {
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 800;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 4px;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--yellow);
      transition: width 200ms ease;
    }

    .timer {
      min-width: 104px;
      padding: 6px 12px;
      text-align: center;
      background: #061f33;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
    }

    .timer-label {
      display: block;
      margin-bottom: 2px;
      color: #b6cad4;
      font-size: 11px;
      font-weight: 800;
    }

    .timer-value {
      font-variant-numeric: tabular-nums;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.1;
    }

    .timer.warning {
      color: #1c2022;
      background: var(--yellow);
      border-color: var(--yellow);
    }

    .timer.warning .timer-label {
      color: #4f440e;
    }

    .timer.danger {
      color: #fff;
      background: var(--red);
      border-color: var(--red);
      animation: pulse 700ms infinite alternate;
    }

    .timer.danger .timer-label {
      color: #fff;
    }

    @keyframes pulse {
      to {
        opacity: 0.76;
      }
    }

    .question-area {
      padding: clamp(18px, 3.5vw, 32px) clamp(18px, 4vw, 40px);
    }

    .panel-hint {
      display: inline-flex;
      align-items: center;
      margin-bottom: 14px;
      padding: 7px 12px;
      color: #07553f;
      font-size: 13.5px;
      font-weight: 800;
      line-height: 1.45;
      background: #e5f3ee;
      border-left: 4px solid var(--green);
      border-radius: 4px;
    }

    .question-text {
      margin: 0 0 20px;
      color: var(--navy);
      font-size: clamp(19px, 2.8vw, 24px);
      line-height: 1.45;
      font-weight: 800;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      width: 100%;
      min-height: 54px;
      padding: 10px 16px;
      display: grid;
      grid-template-columns: 34px 1fr;
      align-items: center;
      gap: 12px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      background: #f8fafb;
      border: 2px solid #c8d4da;
      border-radius: 8px;
      transition: background 120ms ease, border-color 120ms ease, transform 100ms ease;
    }

    .option:active:not(:disabled) {
      transform: scale(0.99);
      background: #e7eff2;
    }

    .option:hover:not(:disabled) {
      background: #edf5f7;
      border-color: var(--navy-light);
    }

    .option:disabled {
      cursor: default;
    }

    .option-letter {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      background: var(--navy-light);
      border-radius: 50%;
    }

    .option-text {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
    }

    .option.correct {
      color: #064b30;
      background: #dff2e8;
      border-color: var(--correct);
    }

    .option.correct .option-letter {
      background: var(--correct);
    }

    .option.wrong {
      color: #74171d;
      background: #fae7e8;
      border-color: var(--wrong);
    }

    .option.wrong .option-letter {
      background: var(--wrong);
    }

    .feedback {
      min-height: 24px;
      margin: 14px 0 0;
      font-size: 15px;
      font-weight: 800;
    }

    .feedback.good {
      color: var(--correct);
    }

    .feedback.bad {
      color: var(--wrong);
    }

    dialog {
      width: min(640px, calc(100% - 36px));
      max-height: 86vh;
      padding: 0;
      overflow: hidden;
      color: var(--text);
      background: #fff;
      border: 0;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    dialog::backdrop {
      background: rgba(3, 22, 34, 0.8);
      backdrop-filter: blur(2px);
    }

    .result-head {
      padding: 24px 20px;
      color: #fff;
      text-align: center;
      background: var(--navy);
      border-top: 5px solid var(--red);
    }

    .result-symbol {
      width: 50px;
      height: 50px;
      margin: 0 auto 10px;
      display: grid;
      place-items: center;
      color: var(--yellow);
      font-size: 30px;
      border: 2px solid var(--yellow);
      border-radius: 50%;
    }

    .result-head h2 {
      margin: 0 0 4px;
      font-size: 24px;
    }

    .result-score {
      margin: 0;
      color: #c7dce5;
      font-size: 15px;
    }

    .result-score strong {
      color: #fff;
      font-size: 30px;
    }

    .result-body {
      max-height: 56vh;
      padding: 20px 24px 24px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .encouragement {
      margin: 0 0 16px;
      color: var(--navy);
      text-align: center;
      font-size: 16.5px;
      font-weight: 800;
      line-height: 1.5;
    }

    .review-title {
      margin: 18px 0 10px;
      color: var(--navy);
      font-size: 16px;
    }

    .review-list {
      display: grid;
      gap: 8px;
    }

    .review-item {
      padding: 10px 12px;
      background: #f5f8f9;
      border-left: 4px solid var(--wrong);
      border-radius: 4px;
    }

    .review-item.correct-review {
      border-left-color: var(--correct);
    }

    .review-item p {
      margin: 0;
      font-size: 14.5px;
      line-height: 1.45;
    }

    .review-answer {
      margin-top: 4px !important;
      color: var(--muted);
      font-size: 13px;
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    footer {
      width: min(920px, calc(100% - 36px));
      margin: 0 auto 24px;
      color: #526d79;
      text-align: center;
      font-size: 13px;
      line-height: 1.55;
    }

    /* 平板橫向及筆電緊湊顯示優化 */
    @media (max-height: 800px) and (min-width: 700px) {
      main {
        margin-top: 16px;
        margin-bottom: 24px;
      }

      .start-banner {
        padding: 26px 36px;
      }

      .question-area {
        padding: 18px 30px;
      }

      .question-text {
        margin-bottom: 14px;
      }

      .option {
        min-height: 48px;
        padding: 8px 14px;
      }
    }

    /* 手機直向適配 */
    @media (max-width: 640px) {
      .header-inner {
        width: min(100% - 24px, 960px);
        min-height: 72px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        font-size: 24px;
      }

      .header-badge {
        display: none;
      }

      main {
        width: min(100% - 24px, 920px);
        margin-top: 16px;
      }

      .start-banner {
        padding: 26px 18px;
      }

      .start-content {
        padding: 20px 16px;
      }

      .facts {
        grid-template-columns: 1fr;
      }

      .fact {
        min-height: auto;
        padding: 12px;
      }

      .fact + .fact {
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      .statusbar {
        gap: 10px;
        padding: 12px 14px;
      }

      .timer {
        min-width: 90px;
        padding: 5px 8px;
      }

      .timer-value {
        font-size: 20px;
      }

      .question-area {
        padding: 18px 14px;
      }

      .option {
        padding: 10px 12px;
        grid-template-columns: 30px 1fr;
      }

      .option-letter {
        width: 28px;
        height: 28px;
        font-size: 14px;
      }

      .option-text {
        font-size: 15px;
      }

      .result-actions {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">☢</div>
        <div>
          <p class="brand-kicker">認識風險・提升安全・共同守護</p>
          <h1 class="brand-title">國家核安全知識挑戰</h1>
        </div>
      </div>

      <div class="header-badge">核安全教育挑戰</div>
    </div>
  </header>

  <main>
    <section id="startScreen" class="screen active" aria-labelledby="startTitle">
      <div class="start-panel">
        <div class="start-banner">
          <span class="label">展板學習活動</span>
          <h2 id="startTitle">你對核安全認識多少？</h2>
          <p>
            從事故中吸取教訓，以科學、制度、專業及責任共同守護人民安全。
          </p>
        </div>

        <div class="start-content">
          <div class="facts" aria-label="遊戲資料">
            <div class="fact">
              <strong>100</strong>
              <span>題展板題庫</span>
            </div>

            <div class="fact">
              <strong>20</strong>
              <span>每局挑戰題目</span>
            </div>

            <div class="fact">
              <strong>01:30</strong>
              <span>作答時間</span>
            </div>
          </div>

          <p class="start-note">
            每題均會提示答案位於哪一幅展板及哪一個部分。每次開始時，
            系統會重新隨機抽選題目及排列答案選項。
          </p>

          <button id="startButton" class="primary-btn start-btn" type="button">
            開始挑戰
          </button>
        </div>
      </div>
    </section>

    <section id="quizScreen" class="screen" aria-label="國家核安全選擇題">
      <div class="quiz-panel">
        <div class="statusbar">
          <div>
            <div id="progressCopy" class="progress-copy">第 1 / 20 題</div>

            <div
              class="progress-track"
              role="progressbar"
              aria-label="答題進度"
              aria-valuemin="0"
              aria-valuemax="20"
              aria-valuenow="1"
            >
              <div id="progressFill" class="progress-fill"></div>
            </div>
          </div>

          <div id="timer" class="timer" aria-live="polite">
            <span class="timer-label">剩餘時間</span>
            <span id="timerValue" class="timer-value">01:30</span>
          </div>
        </div>

        <div class="question-area">
          <div id="panelHint" class="panel-hint"></div>
          <h2 id="questionText" class="question-text"></h2>
          <div id="options" class="options"></div>
          <p id="feedback" class="feedback" aria-live="polite"></p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    核安全不是單靠一項技術，而是由科學設計、嚴格監管、專業操作、
    應急管理及社會共同參與所共同保障。
  </footer>

  <dialog id="resultDialog" aria-labelledby="resultTitle">
    <div class="result-head">
      <div class="result-symbol" aria-hidden="true">✓</div>
      <h2 id="resultTitle">挑戰完成</h2>
      <p class="result-score">
        得分：<strong id="scoreDisplay">0 / 20</strong>
      </p>
    </div>

    <div class="result-body">
      <p id="encouragement" class="encouragement"></p>

      <h3 class="review-title">答案回顧</h3>
      <div id="reviewList" class="review-list"></div>

      <div class="result-actions">
        <button id="restartButton" class="primary-btn" type="button">
          再挑戰一次
        </button>

        <button id="homeButton" class="secondary-btn" type="button">
          返回首頁
        </button>
      </div>
    </div>
  </dialog>

  <script>
    "use strict";

    const QUESTION_COUNT = 20;
    const QUIZ_SECONDS = 90;

    const questionBank = [
      [1, "核事故不是「核彈爆炸」", "根據展板內容，核電站主要利用以下哪一種過程產生熱能？", "受控的核裂變", "煤炭燃燒", "太陽能聚變", "海水蒸發"],
      [1, "核事故不是「核彈爆炸」", "關於核事故與核武器爆炸的原理，以下哪一項說法是正確的？", "兩者的原理並不相同", "兩者的原理完全相同", "兩者只有發生地點不同", "兩者只有爆炸聲音不同"],
      [1, "核事故不是「核彈爆炸」", "一般核事故可能涉及反應堆內哪些系統失去控制或無法正常運作？", "反應、冷卻或安全系統", "售票及收費系統", "道路交通燈系統", "校園廣播系統"],
      [1, "核事故不是「核彈爆炸」", "當核燃料受損時，可能造成以下哪一項嚴重後果？", "放射性物質釋放到環境", "空氣中的氧氣完全消失", "海水立即變成食水", "反應堆變成核武器"],
      [1, "認識風險，吸取教訓", "根據兩宗核事故的經驗，核事故的成因通常涉及以下哪一種情況？", "技術、管理、監管及應急等多重因素", "只涉及天氣因素", "只涉及個人運氣", "必然只涉及設備老化"],
      [1, "切爾諾貝爾核事故", "切爾諾貝爾核事故是在以下哪一年發生的？", "1986年", "1976年", "1996年", "2011年"],
      [1, "切爾諾貝爾核事故", "切爾諾貝爾核事故的實際發生日期是哪一天？", "1986年4月26日", "1986年1月1日", "2011年3月11日", "2018年1月1日"],
      [1, "切爾諾貝爾核事故", "切爾諾貝爾核電站位於以下哪一個地方？", "前蘇聯烏克蘭", "日本福島縣", "中國香港", "美國紐約"],
      [1, "切爾諾貝爾核事故", "切爾諾貝爾核事故主要涉及核電站的哪一號機組？", "第4號機組", "第1號機組", "第2號機組", "第8號機組"],

      [3, "國家核安全工作的核心方向", "根據展板內容，我國核安全工作以以下哪一項作為根本？", "人民安全", "發電數量", "建築高度", "宣傳規模"],
      [3, "國家核安全工作的核心方向", "國家可以如何透過科技發展及人才培養，持續提升核安全水平？", "發展自主科技、培養人才、升級設備及推動科研合作", "減少所有監測技術", "停止專業教育", "取消設備維修"],
      [3, "國家核安全工作的核心方向", "維護國家核安全同時也是在維護以下哪些重要利益？", "國家安全、公共安全及香港市民福祉", "只有核電站的收入", "只有旅遊活動", "只有能源價格"]
    ];

    const startScreen = document.getElementById("startScreen");
    const quizScreen = document.getElementById("quizScreen");
    const startButton = document.getElementById("startButton");
    const restartButton = document.getElementById("restartButton");
    const homeButton = document.getElementById("homeButton");
    const progressCopy = document.getElementById("progressCopy");
    const progressTrack = document.querySelector(".progress-track");
    const progressFill = document.getElementById("progressFill");
    const timer = document.getElementById("timer");
    const timerValue = document.getElementById("timerValue");
    const panelHint = document.getElementById("panelHint");
    const questionText = document.getElementById("questionText");
    const optionsElement = document.getElementById("options");
    const feedback = document.getElementById("feedback");
    const resultDialog = document.getElementById("resultDialog");
    const resultTitle = document.getElementById("resultTitle");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const encouragement = document.getElementById("encouragement");
    const reviewList = document.getElementById("reviewList");

    let quizQuestions = [];
    let currentQuestion = 0;
    let score = 0;
    let secondsLeft = QUIZ_SECONDS;
    let timerId = null;
    let answerLocked = false;
    let quizFinished = false;
    let responses = [];

    function shuffle(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
      }
      return copy;
    }

    function getQuestionsByPanel(panelNumber, amount, usedQuestions) {
      const availableQuestions = questionBank.filter((rawQuestion) => {
        return rawQuestion[0] === panelNumber && !usedQuestions.includes(rawQuestion);
      });
      return shuffle(availableQuestions).slice(0, amount);
    }

    function buildQuestionSequence() {
      const selectedQuestions = [];
      selectedQuestions.push(...getQuestionsByPanel(1, 4, selectedQuestions));
      selectedQuestions.push(...getQuestionsByPanel(2, 3, selectedQuestions));
      selectedQuestions.push(...getQuestionsByPanel(3, 3, selectedQuestions));
      selectedQuestions.push(...getQuestionsByPanel(1, 2, selectedQuestions));
      selectedQuestions.push(...getQuestionsByPanel(2, 2, selectedQuestions));
      selectedQuestions.push(...getQuestionsByPanel(3, 1, selectedQuestions));

      const unusedQuestions = questionBank.filter((rawQuestion) => {
        return !selectedQuestions.includes(rawQuestion);
      });

      const remainingAmount = QUESTION_COUNT - selectedQuestions.length;
      selectedQuestions.push(...shuffle(unusedQuestions).slice(0, remainingAmount));

      return selectedQuestions;
    }

    function createQuestion(rawQuestion) {
      const [panel, section, text, answer, wrongAnswer1, wrongAnswer2, wrongAnswer3] = rawQuestion;
      return {
        panel,
        section,
        text,
        answer,
        options: shuffle([answer, wrongAnswer1, wrongAnswer2, wrongAnswer3])
      };
    }

    function startQuiz() {
      clearInterval(timerId);

      quizQuestions = buildQuestionSequence().map(createQuestion);
      currentQuestion = 0;
      score = 0;
      secondsLeft = QUIZ_SECONDS;
      answerLocked = false;
      quizFinished = false;
      responses = [];

      if (resultDialog.open) {
        resultDialog.close();
      }

      startScreen.classList.remove("active");
      quizScreen.classList.add("active");

      updateTimer();
      showQuestion();

      timerId = window.setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          secondsLeft = 0;
          updateTimer();
          finishQuiz(true);
          return;
        }
        updateTimer();
      }, 1000);
    }

    function showQuestion() {
      answerLocked = false;
      feedback.textContent = "";
      feedback.className = "feedback";

      const question = quizQuestions[currentQuestion];
      const currentNumber = currentQuestion + 1;
      const progress = (currentNumber / QUESTION_COUNT) * 100;

      progressCopy.textContent = `第 ${currentNumber} / ${QUESTION_COUNT} 題`;
      progressFill.style.width = `${progress}%`;
      progressTrack.setAttribute("aria-valuenow", currentNumber);

      panelHint.textContent = `提示：請到第 ${question.panel} 幅展板的「${question.section}」部分尋找答案`;
      questionText.textContent = question.text;
      optionsElement.replaceChildren();

      question.options.forEach((option, index) => {
        const button = document.createElement("button");
        const letter = document.createElement("span");
        const optionText = document.createElement("span");

        button.type = "button";
        button.className = "option";
        button.dataset.answer = option;
        button.setAttribute("aria-label", `選項 ${String.fromCharCode(65 + index)}：${option}`);

        letter.className = "option-letter";
        letter.textContent = String.fromCharCode(65 + index);

        optionText.className = "option-text";
        optionText.textContent = option;

        button.append(letter, optionText);
        button.addEventListener("click", () => selectAnswer(button, option));
        optionsElement.appendChild(button);
      });

      const firstOption = optionsElement.querySelector(".option");
      if (firstOption) {
        firstOption.focus();
      }
    }

    function selectAnswer(selectedButton, selectedAnswer) {
      if (answerLocked || quizFinished) return;
      answerLocked = true;

      const question = quizQuestions[currentQuestion];
      const isCorrect = selectedAnswer === question.answer;
      const optionButtons = optionsElement.querySelectorAll(".option");

      optionButtons.forEach((button) => {
        button.disabled = true;
        if (button.dataset.answer === question.answer) {
          button.classList.add("correct");
        }
      });

      if (isCorrect) {
        score += 1;
        feedback.textContent = "答對了！你成功從展板中找到了正確資料。";
        feedback.classList.add("good");
      } else {
        selectedButton.classList.add("wrong");
        feedback.textContent = `答錯了，正確答案是：${question.answer}`;
        feedback.classList.add("bad");
      }

      responses.push({
        question: question.text,
        answer: question.answer,
        selected: selectedAnswer,
        panel: question.panel,
        section: question.section,
        correct: isCorrect
      });

      window.setTimeout(() => {
        if (quizFinished) return;
        if (currentQuestion < QUESTION_COUNT - 1) {
          currentQuestion += 1;
          showQuestion();
        } else {
          finishQuiz(false);
        }
      }, 750);
    }

    function updateTimer() {
      const minutes = Math.floor(secondsLeft / 60);
      const seconds = secondsLeft % 60;

      timerValue.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      timer.classList.remove("warning", "danger");

      if (secondsLeft <= 10) {
        timer.classList.add("danger");
      } else if (secondsLeft <= 30) {
        timer.classList.add("warning");
      }
    }

    function finishQuiz(timeUp) {
      if (quizFinished) return;
      quizFinished = true;
      answerLocked = true;

      clearInterval(timerId);
      timerId = null;

      const answeredCount = responses.length;
      const unansweredQuestions = quizQuestions.slice(answeredCount);

      unansweredQuestions.forEach((question) => {
        responses.push({
          question: question.text,
          answer: question.answer,
          selected: "未作答",
          panel: question.panel,
          section: question.section,
          correct: false
        });
      });

      const percentage = Math.round((score / QUESTION_COUNT) * 100);

      resultTitle.textContent = timeUp ? "時間到！" : "挑戰完成";
      scoreDisplay.textContent = `${score} / ${QUESTION_COUNT}`;

      if (percentage === 100) {
        encouragement.textContent = "滿分！你對三幅展板的核安全內容掌握得非常全面，表現十分出色！";
      } else if (percentage >= 85) {
        encouragement.textContent = "表現優秀！你已掌握核事故成因、安全啟示及國家核安全保障的主要內容。";
      } else if (percentage >= 70) {
        encouragement.textContent = "做得很好！再留意展板中的年份、事故成因及安全措施，你一定可以取得更高分。";
      } else if (percentage >= 50) {
        encouragement.textContent = "你已掌握不少重要知識。請參考答案回顧，再到相關展板尋找資料吧！";
      } else {
        encouragement.textContent = "繼續努力！每一次挑戰都是學習機會，重新閱讀展板後再試一次吧！";
      }

      buildReview();

      if (!resultDialog.open) {
        resultDialog.showModal();
      }
    }

    function buildReview() {
      reviewList.replaceChildren();

      responses.forEach((response, index) => {
        const item = document.createElement("div");
        const questionLine = document.createElement("p");
        const selectedLine = document.createElement("p");
        const answerLine = document.createElement("p");

        item.className = `review-item${response.correct ? " correct-review" : ""}`;
        questionLine.textContent = `${index + 1}. ${response.correct ? "✓ 答對" : "✗ 答錯"}：` + response.question;

        selectedLine.className = "review-answer";
        selectedLine.textContent = `你的答案：${response.selected}`;

        answerLine.className = "review-answer";
        answerLine.textContent = `正確答案：${response.answer}｜第 ${response.panel} 幅展板「${response.section}」`;

        item.append(questionLine, selectedLine, answerLine);
        reviewList.appendChild(item);
      });
    }

    function returnHome() {
      clearInterval(timerId);
      timerId = null;
      quizFinished = true;

      if (resultDialog.open) {
        resultDialog.close();
      }

      quizScreen.classList.remove("active");
      startScreen.classList.add("active");
      startButton.focus();
    }

    startButton.addEventListener("click", startQuiz);
    restartButton.addEventListener("click", startQuiz);
    homeButton.addEventListener("click", returnHome);

    document.addEventListener("keydown", (event) => {
      if (!quizScreen.classList.contains("active") || answerLocked || quizFinished) {
        return;
      }

      const optionNumber = Number(event.key);
      if (optionNumber >= 1 && optionNumber <= 4) {
        const options = optionsElement.querySelectorAll(".option");
        const selectedOption = options[optionNumber - 1];
        if (selectedOption) {
          selectedOption.click();
        }
      }
    });

    resultDialog.addEventListener("cancel", (event) => {
      event.preventDefault();
    });
  </script>
